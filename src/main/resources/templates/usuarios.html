<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de usuarios</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #FFFFFF;
        }

        nav {
            background-color: #3F6078;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
        }

        .biblioteca {
            color: #FFFFFF;
            font-size: 32px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 35px;
        }

        .menu a {
            color: #FFFFFF;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
        }

        main {
            padding: 40px;
        }

        h1 {
            color: #24394B;
            font-size: 36px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th, td {
            border: 1px solid #000000;
            padding: 15px;
            text-align: left;
        }

        th {
            background-color: #DCE7EF;
            color: #243B53;
            font-size: 24px;
            font-weight: bold;
        }

        td {
            background-color: #FFFFFF;
            color: #000000;
            font-size: 20px;
            font-weight: normal;
        }
    </style>
</head>

<body>

<nav>
    <div class="biblioteca">Biblioteca</div>

    <div class="menu">
        <a th:href="@{/libros}">Libros</a>
        <a th:href="@{/usuarios}">Usuarios</a>
        <a th:href="@{/prestamos}">Préstamos</a>
    </div>
</nav>

<main>
    <h1>Gestión de usuarios</h1>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellidos</th>
            <th>Correo electrónico</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.id}"></td>
            <td th:text="${usuario.nombre}"></td>
            <td th:text="${usuario.apellidos}"></td>
            <td th:text="${usuario.email}"></td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
